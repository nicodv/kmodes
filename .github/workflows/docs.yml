name: Documentation

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and documentation dependencies
        run: python -m pip install . -r docs/requirements.txt
      - name: Build HTML with strict references and warnings
        run: python -m sphinx -b html -n -W --keep-going docs docs/_build/html
      - name: Check documentation examples
        run: |
          python -m sphinx -b doctest -W --keep-going docs docs/_build/doctest
          python examples/quickstart_kmodes.py
          python examples/quickstart_kprototypes.py
